
services:
  # Database Service (MySQL 8.0)
  database:
    image: mysql:8.0
    container_name: crm_database
    restart: unless-stopped
    tty: true
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: crm_exam
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - crm_network

  # API Service (Laravel PHP-FPM)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_api
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: api
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: crm_exam
      DB_USERNAME: crm_user
      DB_PASSWORD: crm_password
      ELASTICSEARCH_HOST: searcher
      ELASTICSEARCH_PORT: 9200
    volumes:
      - ./backend:/var/www
    depends_on:
      - database
    networks:
      - crm_network

  # Controller Service (Nginx Reverse Proxy)
  controller:
    image: nginx:alpine
    container_name: crm_controller
    restart: unless-stopped
    tty: true
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - crm_network

  # Searcher Service (Elasticsearch 8.x)
  searcher:
    image: elasticsearch:8.11.0
    container_name: crm_searcher
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - crm_network

networks:
  crm_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  es_data:
    driver: local
